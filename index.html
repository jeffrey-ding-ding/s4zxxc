<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>💥 爆炸模拟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            cursor: default;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            touch-action: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        @keyframes screenShake {
            0% { transform: translate(0, 0) scale(1); }
            8% { transform: translate(-14px, 10px) scale(1.012); }
            16% { transform: translate(16px, -12px) scale(1.018); }
            24% { transform: translate(-20px, 8px) scale(1.02); }
            32% { transform: translate(15px, 14px) scale(1.022); }
            40% { transform: translate(-12px, -16px) scale(1.018); }
            50% { transform: translate(10px, 6px) scale(1.014); }
            60% { transform: translate(-8px, -5px) scale(1.01); }
            70% { transform: translate(6px, 4px) scale(1.006); }
            80% { transform: translate(-4px, 2px) scale(1.003); }
            90% { transform: translate(2px, -1px) scale(1.001); }
            100% { transform: translate(0, 0) scale(1); }
        }
        .shake-hard { animation: screenShake 0.9s ease-out both; }

        #flashOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.05s ease-out;
        }
        #flashOverlay.active {
            opacity: 1;
            transition: opacity 0.1s ease-out;
        }

        #warmGlow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(255, 160, 40, 0.4) 0%, rgba(255, 80, 10, 0.18) 40%, rgba(0, 0, 0, 0) 75%);
            opacity: 0;
            transition: opacity 0.3s ease-out;
        }
        #warmGlow.active {
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.8) 100%);
        }

        #fakeText {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            font-size: clamp(54px, 12vw, 150px);
            font-weight: 900;
            color: #ffeb6b;
            text-shadow: 
                0 0 8px #fff,
                0 0 18px #ff8c00,
                0 0 35px #ff5500,
                0 0 60px #ff2200,
                0 0 100px #ff0000,
                4px 4px 0 #6b0000,
                8px 8px 0 rgba(0,0,0,0.5);
            font-family: 'Arial Black', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.08em;
            opacity: 1;
        }
        #fakeText .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(60px) scale(0.2) rotate(-30deg);
        }
        #fakeText.show .char {
            animation: charPop 0.7s cubic-bezier(0.34, 1.8, 0.5, 1) forwards;
        }
        #fakeText.show .char:nth-child(1) { animation: charPop 0.7s cubic-bezier(0.34, 1.8, 0.5, 1) 0s forwards, charWiggle 1.8s ease-in-out 0.7s infinite; }
        #fakeText.show .char:nth-child(2) { animation: charPop 0.7s cubic-bezier(0.34, 1.8, 0.5, 1) 0.1s forwards, charWiggle 1.8s ease-in-out 0.8s infinite; }
        #fakeText.show .char:nth-child(3) { animation: charPop 0.7s cubic-bezier(0.34, 1.8, 0.5, 1) 0.2s forwards, charWiggle 1.8s ease-in-out 0.9s infinite; }
        #fakeText.show .char:nth-child(4) { animation: charPop 0.7s cubic-bezier(0.34, 1.8, 0.5, 1) 0.3s forwards, charWiggle 1.8s ease-in-out 1s infinite; }
        #fakeText.show .char:nth-child(5) { animation: charPop 0.7s cubic-bezier(0.34, 1.8, 0.5, 1) 0.4s forwards, charWiggle 1.8s ease-in-out 1.1s infinite; }
        @keyframes charPop {
            0% { opacity: 0; transform: translateY(60px) scale(0.2) rotate(-30deg); }
            55% { opacity: 1; transform: translateY(-15px) scale(1.3) rotate(10deg); }
            75% { transform: translateY(5px) scale(0.92) rotate(-4deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(-1deg); }
        }
        @keyframes charWiggle {
            0%, 100% { transform: translateY(0) scale(1) rotate(-1deg); }
            50% { transform: translateY(-12px) scale(1.02) rotate(2deg); }
        }
    </style>
</head>
<body>

    <canvas id="explosionCanvas"></canvas>
    <div id="flashOverlay"></div>
    <div id="warmGlow"></div>
    <div id="vignette"></div>
    <div id="fakeText"><span class="char">被</span><span class="char">骗</span><span class="char">到</span><span class="char">了</span><span class="char">吧</span></div>

    <script>
        (function() {
            const canvas = document.getElementById('explosionCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            const flashOverlay = document.getElementById('flashOverlay');
            const warmGlow = document.getElementById('warmGlow');
            const fakeTextEl = document.getElementById('fakeText');

            let W, H, DPR;

            function resizeCanvas() {
                DPR = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W * DPR;
                canvas.height = H * DPR;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            }
            resizeCanvas();

            let GROUND_Y, EXPLOSION_X, EXPLOSION_Y, MAX_FIREBALL_RADIUS, MAX_SHOCKWAVE_RADIUS, BOMB_RADIUS;

            function updateConstants() {
                GROUND_Y = H * 0.78;
                EXPLOSION_X = W * 0.5;
                EXPLOSION_Y = H * 0.52;
                MAX_FIREBALL_RADIUS = Math.min(W, H) * 0.55;
                MAX_SHOCKWAVE_RADIUS = Math.max(W, H) * 1.3;
                BOMB_RADIUS = Math.min(W, H) * 0.09;
            }
            updateConstants();

            window.addEventListener('resize', () => {
                resizeCanvas();
                updateConstants();
            });

            // ==================== 音效系统 ====================
            let audioCtx = null;
            let audioReady = false;

            function initAudio() {
                if (audioCtx) return;
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AC();
                    audioReady = true;
                } catch (e) {}
            }

            function createNoiseBuffer(duration, sampleRate) {
                const bufferSize = Math.max(1, Math.floor(sampleRate * duration));
                const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                return buffer;
            }

            function createExplosionSound() {
                if (!audioCtx || !audioReady) return;
                const now = audioCtx.currentTime;
                const sampleRate = audioCtx.sampleRate;

                const noiseDuration = 3.5;
                const noiseBuffer = createNoiseBuffer(noiseDuration, sampleRate);
                const noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                noiseSource.loop = true;

                const lowpass = audioCtx.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.setValueAtTime(12000, now);
                lowpass.frequency.exponentialRampToValueAtTime(400, now + 1.0);
                lowpass.frequency.exponentialRampToValueAtTime(100, now + 2.5);
                lowpass.frequency.exponentialRampToValueAtTime(50, now + 3.5);
                lowpass.Q.setValueAtTime(0.7, now);

                const highpass = audioCtx.createBiquadFilter();
                highpass.type = 'highpass';
                highpass.frequency.setValueAtTime(25, now);
                highpass.frequency.exponentialRampToValueAtTime(40, now + 0.5);
                highpass.Q.setValueAtTime(0.5, now);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(1.2, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.4, now + 0.2);
                noiseGain.gain.exponentialRampToValueAtTime(0.1, now + 0.8);
                noiseGain.gain.exponentialRampToValueAtTime(0.015, now + 2.5);
                noiseGain.gain.linearRampToValueAtTime(0, now + 3.5);

                noiseSource.connect(highpass);
                highpass.connect(lowpass);
                lowpass.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noiseSource.start(now);
                noiseSource.stop(now + 3.5);

                const osc1 = audioCtx.createOscillator();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(120, now);
                osc1.frequency.exponentialRampToValueAtTime(22, now + 1.5);
                const osc1Gain = audioCtx.createGain();
                osc1Gain.gain.setValueAtTime(1.1, now);
                osc1Gain.gain.exponentialRampToValueAtTime(0.35, now + 0.4);
                osc1Gain.gain.exponentialRampToValueAtTime(0.025, now + 2.0);
                osc1Gain.gain.linearRampToValueAtTime(0, now + 2.8);
                osc1.connect(osc1Gain);
                osc1Gain.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 2.8);

                const osc2 = audioCtx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(40, now);
                osc2.frequency.exponentialRampToValueAtTime(12, now + 1.2);
                const osc2Gain = audioCtx.createGain();
                osc2Gain.gain.setValueAtTime(0.7, now);
                osc2Gain.gain.exponentialRampToValueAtTime(0.12, now + 0.5);
                osc2Gain.gain.linearRampToValueAtTime(0, now + 1.8);
                osc2.connect(osc2Gain);
                osc2Gain.connect(audioCtx.destination);
                osc2.start(now);
                osc2.stop(now + 1.8);

                const crackBuffer = createNoiseBuffer(0.5, sampleRate);
                const crackSource = audioCtx.createBufferSource();
                crackSource.buffer = crackBuffer;
                const crackFilter = audioCtx.createBiquadFilter();
                crackFilter.type = 'bandpass';
                crackFilter.frequency.setValueAtTime(4000, now);
                crackFilter.frequency.exponentialRampToValueAtTime(600, now + 0.4);
                crackFilter.Q.setValueAtTime(1.0, now);
                const crackGain = audioCtx.createGain();
                crackGain.gain.setValueAtTime(0.9, now);
                crackGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                crackGain.gain.linearRampToValueAtTime(0, now + 0.5);
                crackSource.connect(crackFilter);
                crackFilter.connect(crackGain);
                crackGain.connect(audioCtx.destination);
                crackSource.start(now + 0.05);
                crackSource.stop(now + 0.55);

                const delayNode = audioCtx.createDelay(2.0);
                delayNode.delayTime.setValueAtTime(0.5, now);
                const feedbackGain = audioCtx.createGain();
                feedbackGain.gain.setValueAtTime(0.35, now);
                const echoGain = audioCtx.createGain();
                echoGain.gain.setValueAtTime(0.4, now);
                echoGain.gain.exponentialRampToValueAtTime(0.01, now + 2.0);

                lowpass.connect(delayNode);
                delayNode.connect(feedbackGain);
                feedbackGain.connect(delayNode);
                delayNode.connect(echoGain);
                echoGain.connect(audioCtx.destination);

                for (let i = 0; i < 20; i++) {
                    const splashDelay = 0.15 + Math.random() * 1.8;
                    const splashDur = 0.03 + Math.random() * 0.1;
                    const splashBuffer = createNoiseBuffer(splashDur + 0.05, sampleRate);
                    const splashSource = audioCtx.createBufferSource();
                    splashSource.buffer = splashBuffer;
                    const splashFilter = audioCtx.createBiquadFilter();
                    splashFilter.type = 'bandpass';
                    splashFilter.frequency.setValueAtTime(1500 + Math.random() * 3500, now + splashDelay);
                    splashFilter.Q.setValueAtTime(2.0, now + splashDelay);
                    const splashGain = audioCtx.createGain();
                    splashGain.gain.setValueAtTime(0.04 + Math.random() * 0.1, now + splashDelay);
                    splashGain.gain.exponentialRampToValueAtTime(0.001, now + splashDelay + splashDur);
                    splashSource.connect(splashFilter);
                    splashFilter.connect(splashGain);
                    splashGain.connect(audioCtx.destination);
                    splashSource.start(now + splashDelay);
                    splashSource.stop(now + splashDelay + splashDur + 0.05);
                }

                const rumbleBuf = createNoiseBuffer(2.5, sampleRate);
                const rumbleSrc = audioCtx.createBufferSource();
                rumbleSrc.buffer = rumbleBuf;
                rumbleSrc.loop = true;
                const rumbleFilter = audioCtx.createBiquadFilter();
                rumbleFilter.type = 'lowpass';
                rumbleFilter.frequency.setValueAtTime(150, now + 0.5);
                rumbleFilter.frequency.exponentialRampToValueAtTime(60, now + 2.5);
                const rumbleGain = audioCtx.createGain();
                rumbleGain.gain.setValueAtTime(0, now + 0.5);
                rumbleGain.gain.linearRampToValueAtTime(0.15, now + 0.8);
                rumbleGain.gain.exponentialRampToValueAtTime(0.01, now + 2.5);
                rumbleSrc.connect(rumbleFilter);
                rumbleFilter.connect(rumbleGain);
                rumbleGain.connect(audioCtx.destination);
                rumbleSrc.start(now + 0.5);
                rumbleSrc.stop(now + 2.6);
            }

            function playExplosionSound() {
                if (!audioCtx) {
                    initAudio();
                }
                if (audioCtx && audioReady) {
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume().then(() => {
                            createExplosionSound();
                        }).catch(() => {});
                    } else {
                        createExplosionSound();
                    }
                }
            }

            // ==================== 粒子系统 ====================
            let debris = [];
            let smokeParticles = [];
            let embers = [];
            let fireParticles = [];
            let groundFires = [];
            let shockwaves = [];
            let dustParticles = [];
            let fireballActive = true;

            let explosionTime = 0;
            let explosionDuration = 7.5;
            let initialFlashIntensity = 0;
            let screenShakeIntensity = 0;
            let fireballRadius = 0;

            let phase = 'idle';
            let idleTime = 0;
            const idleDuration = 0.9;
            let textShown = false;

            // ==================== 工具函数 ====================
            function lerp(a, b, t) { return a + (b - a) * t; }
            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
            function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }
            function rand(min, max) { return Math.random() * (max - min) + min; }
            function randInt(min, max) { return Math.floor(rand(min, max)); }

            function heatColor(t) {
                t = clamp(t, 0, 1);
                if (t < 0.15) {
                    const k = t / 0.15;
                    return { r: 255, g: 255, b: Math.floor(lerp(240, 200, k)), a: 1 };
                } else if (t < 0.35) {
                    const k = (t - 0.15) / 0.2;
                    return { r: 255, g: Math.floor(lerp(255, 180, k)), b: Math.floor(lerp(200, 50, k)), a: 1 };
                } else if (t < 0.6) {
                    const k = (t - 0.35) / 0.25;
                    return { r: Math.floor(lerp(255, 180, k)), g: Math.floor(lerp(180, 60, k)), b: Math.floor(lerp(50, 15, k)), a: 1 };
                } else if (t < 0.85) {
                    const k = (t - 0.6) / 0.25;
                    return { r: Math.floor(lerp(180, 90, k)), g: Math.floor(lerp(60, 25, k)), b: Math.floor(lerp(15, 8, k)), a: 1 };
                } else {
                    const k = (t - 0.85) / 0.15;
                    return { r: Math.floor(lerp(90, 40, k)), g: Math.floor(lerp(25, 12, k)), b: Math.floor(lerp(8, 5, k)), a: 1 - k * 0.5 };
                }
            }

            function rgbaStr(c, alpha) {
                return `rgba(${c.r},${c.g},${c.b},${alpha !== undefined ? alpha : c.a})`;
            }

            // ==================== 创建碎片（真实改进）====================
            function createDebris(count) {
                for (let i = 0; i < count; i++) {
                    // 幂律分布：小碎片多，大碎片少
                    const sizeRand = Math.pow(Math.random(), 2.8);
                    const size = rand(1.5, 14) * (0.25 + sizeRand * 0.75);
                    const speed = rand(120, 1000) * (8 / (size + 3));
                    const ang = rand(0, Math.PI * 2);
                    
                    // 不规则锯齿形状（更多顶点 + 锯齿感）
                    const numVerts = randInt(6, 11);
                    const verts = [];
                    const baseAng = rand(0, Math.PI * 2);
                    for (let v = 0; v < numVerts; v++) {
                        const vAng = baseAng + (v / numVerts) * Math.PI * 2 + rand(-0.35, 0.35);
                        // 半径不规则变化，制造锯齿感
                        const vRad = size * rand(0.4, 1.5);
                        // 偶尔添加尖刺
                        const spike = Math.random() < 0.15 ? rand(1.3, 1.8) : rand(0.7, 1.1);
                        verts.push({ 
                            x: Math.cos(vAng) * vRad * spike, 
                            y: Math.sin(vAng) * vRad * spike 
                        });
                    }
                    
                    const upBias = rand(-0.1, 1.2);
                    
                    // 真实碎片颜色：深灰到黑色（石头/金属），带燃烧痕迹
                    const darkLevel = rand(0.3, 0.7);
                    const baseR = Math.floor(rand(25, 65) * darkLevel);
                    const baseG = Math.floor(rand(22, 55) * darkLevel);
                    const baseB = Math.floor(rand(20, 45) * darkLevel);
                    
                    debris.push({
                        x: EXPLOSION_X + rand(-8, 8),
                        y: EXPLOSION_Y + rand(-8, 8),
                        vx: Math.cos(ang) * speed * 0.8,
                        vy: Math.sin(ang) * speed * 0.65 - speed * upBias * 0.4,
                        rotation: rand(0, Math.PI * 2),
                        angularVel: rand(-12, 12),
                        size: size,
                        verts: verts,
                        age: 0,
                        life: rand(3.0, 6.5),
                        // 深色石头/金属色
                        baseColor: { r: baseR, g: baseG, b: baseB },
                        // 初始燃烧程度（部分碎片是燃烧的）
                        heatLevel: rand(0.4, 1.0),
                        grounded: false,
                        bounceCount: 0,
                        gravity: rand(220, 500),
                        drag: rand(0.985, 0.998),
                        // 拖尾长度因子
                        trailFactor: rand(0.04, 0.09),
                    });
                }
            }

            // ==================== 烟雾（大幅增强可见度）====================
            function createSmoke(count) {
                for (let i = 0; i < count; i++) {
                    const ang = rand(0, Math.PI * 2);
                    const spd = rand(25, 160);
                    const initR = rand(5, 80);
                    smokeParticles.push({
                        x: EXPLOSION_X + Math.cos(ang) * initR,
                        y: EXPLOSION_Y + Math.sin(ang) * initR * 0.7 - rand(0, 40),
                        vx: Math.cos(ang) * spd * 0.5 + rand(-20, 20),
                        vy: rand(-160, -55) - spd * 0.28,
                        radius: rand(32, 78), // 更大
                        age: 0,
                        life: rand(5.0, 11.0),
                        alpha: rand(0.6, 0.95), // 大幅提高不透明度
                        // 更深更黑的颜色
                        colorBase: { r: rand(20, 50), g: rand(18, 42), b: rand(16, 38) },
                        rotation: rand(0, Math.PI * 2),
                        rotSpeed: rand(-0.6, 0.6),
                        turbulence: rand(0.6, 1.8),
                        turbPhase: rand(0, Math.PI * 2),
                        turbFreq: rand(0.3, 0.9),
                        heatAmount: rand(0.3, 0.7),
                    });
                }
            }

            function createMushroomSmoke(count) {
                for (let i = 0; i < count; i++) {
                    const ang = rand(0, Math.PI * 2);
                    smokeParticles.push({
                        x: EXPLOSION_X + Math.cos(ang) * rand(5, 50),
                        y: EXPLOSION_Y + rand(-30, 10),
                        vx: Math.cos(ang) * rand(5, 30),
                        vy: rand(-220, -130),
                        radius: rand(38, 85), // 更大
                        age: 0,
                        life: rand(6.0, 12.0),
                        alpha: rand(0.7, 1.0), // 更高不透明度
                        colorBase: { r: rand(28, 58), g: rand(25, 48), b: rand(22, 42) },
                        rotation: rand(0, Math.PI * 2),
                        rotSpeed: rand(-0.5, 0.5),
                        turbulence: rand(0.8, 2.0),
                        turbPhase: rand(0, Math.PI * 2),
                        turbFreq: rand(0.25, 0.7),
                        heatAmount: rand(0.4, 0.8),
                        isMushroom: true,
                        topY: EXPLOSION_Y - BOMB_RADIUS * rand(6, 10),
                        hasSpread: false,
                    });
                }
            }

            function createEmbers(count) {
                for (let i = 0; i < count; i++) {
                    const ang = rand(0, Math.PI * 2);
                    const spd = rand(80, 480);
                    embers.push({
                        x: EXPLOSION_X + Math.cos(ang) * rand(5, 40),
                        y: EXPLOSION_Y + Math.sin(ang) * rand(5, 40),
                        vx: Math.cos(ang) * spd * rand(0.5, 1.3) + rand(-25, 25),
                        vy: Math.sin(ang) * spd * rand(0.5, 1.2) - rand(0, 200),
                        size: rand(1.5, 5),
                        age: 0,
                        life: rand(2.0, 5.5),
                        flickerSpeed: rand(8, 22),
                        flickerPhase: rand(0, Math.PI * 2),
                        gravity: rand(60, 170),
                        drag: rand(0.99, 0.998),
                    });
                }
            }

            function createFireballParticles(count) {
                for (let i = 0; i < count; i++) {
                    const ang = rand(0, Math.PI * 2);
                    const spd = rand(25, 220);
                    fireParticles.push({
                        x: EXPLOSION_X + Math.cos(ang) * rand(2, 25),
                        y: EXPLOSION_Y + Math.sin(ang) * rand(2, 25),
                        vx: Math.cos(ang) * spd + rand(-20, 20),
                        vy: Math.sin(ang) * spd * 0.7 - rand(10, 100),
                        radius: rand(6, 32),
                        age: 0,
                        life: rand(0.6, 3.0),
                        alpha: rand(0.55, 0.95),
                        colorHeat: rand(0.05, 0.45),
                        drag: rand(0.97, 0.995),
                    });
                }
            }

            function createGroundFires(count) {
                for (let i = 0; i < count; i++) {
                    const offsetX = rand(-120, 120);
                    groundFires.push({
                        x: EXPLOSION_X + offsetX,
                        y: GROUND_Y + rand(-8, 5),
                        radius: rand(6, 22),
                        age: 0,
                        life: rand(2.5, 10.0),
                        flickerSpeed: rand(5, 15),
                        flickerPhase: rand(0, Math.PI * 2),
                        baseAlpha: rand(0.45, 0.85),
                    });
                }
            }

            function createDust(count) {
                for (let i = 0; i < count; i++) {
                    const ang = rand(0, Math.PI * 2);
                    const spd = rand(20, 110);
                    dustParticles.push({
                        x: EXPLOSION_X + Math.cos(ang) * rand(10, 80),
                        y: GROUND_Y + rand(-15, 10),
                        vx: Math.cos(ang) * spd + rand(-8, 8),
                        vy: rand(-80, -15),
                        radius: rand(10, 42),
                        age: 0,
                        life: rand(4.0, 8.5),
                        alpha: rand(0.2, 0.5),
                        color: { r: rand(90, 145), g: rand(75, 120), b: rand(60, 95) },
                        drag: rand(0.99, 0.997),
                    });
                }
            }

            function createShockwave() {
                shockwaves.push({
                    x: EXPLOSION_X, y: EXPLOSION_Y,
                    radius: 0, maxRadius: MAX_SHOCKWAVE_RADIUS,
                    speed: Math.min(W, H) * 6.0, lineWidth: 40,
                    age: 0, life: 1.2, alpha: 1.0,
                });
                shockwaves.push({
                    x: EXPLOSION_X, y: EXPLOSION_Y,
                    radius: 0, maxRadius: MAX_SHOCKWAVE_RADIUS * 0.8,
                    speed: Math.min(W, H) * 4.5, lineWidth: 25,
                    age: -0.18, life: 1.0, alpha: 0.85,
                });
                shockwaves.push({
                    x: EXPLOSION_X, y: GROUND_Y,
                    radius: 0, maxRadius: MAX_SHOCKWAVE_RADIUS * 1.1,
                    speed: Math.min(W, H) * 5.5, lineWidth: 18,
                    age: 0, life: 1.4, alpha: 0.75, isGround: true,
                });
                shockwaves.push({
                    x: EXPLOSION_X, y: GROUND_Y,
                    radius: 0, maxRadius: MAX_SHOCKWAVE_RADIUS * 0.9,
                    speed: Math.min(W, H) * 4.0, lineWidth: 14,
                    age: -0.25, life: 1.2, alpha: 0.6, isGround: true,
                });
            }

            function triggerExplosion() {
                explosionTime = 0;
                explosionDuration = 7.5;
                fireballActive = true;
                initialFlashIntensity = 1.0;
                screenShakeIntensity = 1.0;

                debris = [];
                smokeParticles = [];
                embers = [];
                fireParticles = [];
                groundFires = [];
                shockwaves = [];
                dustParticles = [];

                createDebris(90);
                createSmoke(80);
                createMushroomSmoke(40);
                createEmbers(130);
                createFireballParticles(280);
                createShockwave();

                document.body.classList.remove('shake-hard');
                void document.body.offsetWidth;
                document.body.classList.add('shake-hard');

                flashOverlay.classList.add('active');
                warmGlow.classList.add('active');

                playExplosionSound();

                setTimeout(() => {
                    createGroundFires(35);
                    createDust(45);
                }, 150);

                setTimeout(() => {
                    flashOverlay.classList.remove('active');
                }, 150);

                setTimeout(() => {
                    createMushroomSmoke(25);
                    createSmoke(20);
                }, 400);
            }

            // ==================== 炸弹绘制 ====================
            function drawBomb() {
                const r = BOMB_RADIUS;
                const x = EXPLOSION_X;
                const y = EXPLOSION_Y;

                ctx.save();
                const shadowGrad = ctx.createRadialGradient(x, y + r * 1.1, 0, x, y + r * 1.1, r * 1.5);
                shadowGrad.addColorStop(0, 'rgba(0,0,0,0.65)');
                shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = shadowGrad;
                ctx.beginPath();
                ctx.ellipse(x, y + r * 1.05, r * 1.35, r * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                const fuseLineWidth = Math.max(3, r * 0.07);
                ctx.strokeStyle = '#8a6a45';
                ctx.lineWidth = fuseLineWidth;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(x, y - r * 0.95);
                ctx.quadraticCurveTo(x + r * 0.55, y - r * 1.75, x + r * 0.95, y - r * 2.15);
                ctx.stroke();
                
                ctx.strokeStyle = 'rgba(200, 160, 100, 0.7)';
                ctx.lineWidth = fuseLineWidth * 0.35;
                ctx.beginPath();
                ctx.moveTo(x, y - r * 0.95);
                ctx.quadraticCurveTo(x + r * 0.55, y - r * 1.75, x + r * 0.95, y - r * 2.15);
                ctx.stroke();
                ctx.restore();

                ctx.save();
                const capGrad = ctx.createLinearGradient(x, y - r * 1.1, x, y - r * 0.85);
                capGrad.addColorStop(0, '#9a9a9a');
                capGrad.addColorStop(0.3, '#5a5a5a');
                capGrad.addColorStop(0.7, '#2a2a2a');
                capGrad.addColorStop(1, '#1a1a1a');
                ctx.fillStyle = capGrad;
                ctx.fillRect(x - r * 0.2, y - r * 1.08, r * 0.4, r * 0.18);
                ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x - r * 0.2, y - r * 1.08, r * 0.4, r * 0.18);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillRect(x - r * 0.18, y - r * 1.06, r * 0.36, r * 0.03);
                ctx.restore();

                ctx.save();
                const bodyGrad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.05, x, y, r);
                bodyGrad.addColorStop(0, '#5a5a5a');
                bodyGrad.addColorStop(0.2, '#3a3a3a');
                bodyGrad.addColorStop(0.5, '#1e1e1e');
                bodyGrad.addColorStop(0.85, '#0a0a0a');
                bodyGrad.addColorStop(1, '#000');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.22)';
                ctx.beginPath();
                ctx.ellipse(x - r * 0.35, y - r * 0.35, r * 0.3, r * 0.18, -0.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(x - r * 0.4, y - r * 0.42, r * 0.07, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(80,80,80,0.4)';
                ctx.beginPath();
                ctx.ellipse(x, y + r * 0.65, r * 0.5, r * 0.15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.fillStyle = 'rgba(220,40,20,0.85)';
                ctx.font = `bold ${Math.max(10, r * 0.28)}px Arial Black, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('TNT', x, y + r * 0.15);
                ctx.strokeStyle = 'rgba(0,0,0,0.6)';
                ctx.lineWidth = 1;
                ctx.strokeText('TNT', x, y + r * 0.15);
                ctx.restore();
                
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const pulseT = (performance.now() * 0.003) % (Math.PI * 2);
                const pulse = 0.5 + 0.5 * Math.sin(pulseT);
                const dangerGrad = ctx.createRadialGradient(x, y, 0, x, y, r * 1.6);
                dangerGrad.addColorStop(0, `rgba(255,40,10,${0.05 + pulse * 0.08})`);
                dangerGrad.addColorStop(0.5, `rgba(255,30,5,${0.03 + pulse * 0.05})`);
                dangerGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = dangerGrad;
                ctx.beginPath();
                ctx.arc(x, y, r * 1.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            function renderBombScene() {
                ctx.fillStyle = '#0a0a0c';
                ctx.fillRect(0, 0, W, H);

                const bgGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 20);
                bgGrad.addColorStop(0, '#0d0d12');
                bgGrad.addColorStop(0.55, '#14141a');
                bgGrad.addColorStop(1, '#1a1512');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, GROUND_Y + 20);

                const groundGrad = ctx.createLinearGradient(0, GROUND_Y - 5, 0, H);
                groundGrad.addColorStop(0, '#2a221c');
                groundGrad.addColorStop(0.15, '#1e1814');
                groundGrad.addColorStop(1, '#0f0c0a');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, GROUND_Y - 3, W, H - GROUND_Y + 20);

                ctx.strokeStyle = 'rgba(60,50,40,0.25)';
                ctx.lineWidth = 0.5;
                for (let i = 0; i < 10; i++) {
                    const y = GROUND_Y + (i / 10) * (H - GROUND_Y);
                    ctx.beginPath();
                    ctx.moveTo(0, y + Math.sin(i * 7.3) * 3);
                    ctx.lineTo(W, y + Math.cos(i * 5.1) * 3);
                    ctx.stroke();
                }

                drawBomb();
            }

            // ==================== 爆炸更新 ====================
            function updateExplosion(dt) {
                if (explosionTime >= explosionDuration) return;
                explosionTime += dt;
                const t = explosionTime;

                if (t < 0.35) {
                    const k = easeOutQuint(t / 0.35);
                    fireballRadius = MAX_FIREBALL_RADIUS * k;
                } else if (t < 0.8) {
                    fireballRadius = MAX_FIREBALL_RADIUS * (1 - (t - 0.35) / 0.45 * 0.12);
                } else if (t < 1.6) {
                    const k = (t - 0.8) / 0.8;
                    fireballRadius = MAX_FIREBALL_RADIUS * 0.88 * (1 - k * 0.35);
                } else {
                    const k = (t - 1.6) / 2.5;
                    fireballRadius = MAX_FIREBALL_RADIUS * 0.57 * (1 - k * 0.85);
                    fireballActive = fireballRadius > 10;
                }

                if (initialFlashIntensity > 0) {
                    initialFlashIntensity = Math.max(0, 1.0 - t * 6);
                }

                screenShakeIntensity = Math.max(0, 1.0 - t * 1.4);

                // 更新碎片
                for (let i = debris.length - 1; i >= 0; i--) {
                    const d = debris[i];
                    d.age += dt;
                    if (d.age > d.life || d.y > H + 50 || d.x < -100 || d.x > W + 100) {
                        debris.splice(i, 1);
                        continue;
                    }
                    if (!d.grounded) {
                        d.vx *= d.drag;
                        d.vy = d.vy * d.drag + d.gravity * dt;
                        d.x += d.vx * dt;
                        d.y += d.vy * dt;
                        d.rotation += d.angularVel * dt;
                        if (d.y >= GROUND_Y - d.size * 0.3 && d.vy > 0) {
                            if (d.bounceCount < 2) {
                                d.y = GROUND_Y - d.size * 0.3;
                                d.vy = -d.vy * rand(0.2, 0.45);
                                d.vx *= 0.5;
                                d.angularVel *= 0.6;
                                d.bounceCount++;
                            } else {
                                d.grounded = true;
                                d.y = GROUND_Y - d.size * 0.3;
                                d.vx = 0;
                                d.vy = 0;
                                d.angularVel = 0;
                            }
                        }
                    }
                    // 碎片热量冷却
                    d.heatLevel = Math.max(0, d.heatLevel - dt * 0.25);
                }

                // 更新烟雾
                for (let i = smokeParticles.length - 1; i >= 0; i--) {
                    const s = smokeParticles[i];
                    s.age += dt;
                    if (s.age > s.life) {
                        smokeParticles.splice(i, 1);
                        continue;
                    }
                    
                    const turbX = Math.sin(s.age * s.turbFreq + s.turbPhase) * s.turbulence * 22;
                    const turbY = Math.cos(s.age * s.turbFreq * 0.7 + s.turbPhase) * s.turbulence * 8;
                    s.x += (s.vx + turbX) * dt;
                    s.y += (s.vy + turbY) * dt;
                    
                    if (s.isMushroom && !s.hasSpread && s.y < s.topY) {
                        s.hasSpread = true;
                        s.vy *= 0.3;
                        s.vx *= 2.5;
                    }
                    
                    s.vy = s.vy * 0.997 + 8 * dt;
                    s.vx *= 0.996;
                    s.radius += 20 * dt;
                    s.rotation += s.rotSpeed * dt;
                    
                    const lifeK = s.age / s.life;
                    let alphaMod;
                    if (lifeK < 0.12) {
                        alphaMod = lifeK / 0.12;
                    } else {
                        // 减缓淡出速度，让烟雾更持久可见
                        alphaMod = 1 - (lifeK - 0.12) / 0.88 * 0.85;
                    }
                    s.currentAlpha = s.alpha * alphaMod;
                    s.heatAmount = Math.max(0, s.heatAmount - dt * 0.15);
                }

                for (let i = embers.length - 1; i >= 0; i--) {
                    const e = embers[i];
                    e.age += dt;
                    if (e.age > e.life || e.y > H + 20) {
                        embers.splice(i, 1);
                        continue;
                    }
                    e.vx *= e.drag;
                    e.vy = e.vy * e.drag + e.gravity * dt;
                    e.x += e.vx * dt;
                    e.y += e.vy * dt;
                }

                for (let i = fireParticles.length - 1; i >= 0; i--) {
                    const f = fireParticles[i];
                    f.age += dt;
                    if (f.age > f.life) {
                        fireParticles.splice(i, 1);
                        continue;
                    }
                    f.vx *= f.drag;
                    f.vy = f.vy * f.drag - 35 * dt;
                    f.x += f.vx * dt;
                    f.y += f.vy * dt;
                    f.radius *= (1 - dt * 0.35);
                    const lifeK = f.age / f.life;
                    f.alpha = f.alpha * (1 - lifeK * 0.9);
                    f.colorHeat = 0.05 + lifeK * 0.8;
                }

                for (let i = groundFires.length - 1; i >= 0; i--) {
                    const g = groundFires[i];
                    g.age += dt;
                    if (g.age > g.life) {
                        groundFires.splice(i, 1);
                        continue;
                    }
                }

                for (let i = shockwaves.length - 1; i >= 0; i--) {
                    const sw = shockwaves[i];
                    sw.age += dt;
                    if (sw.age > sw.life) {
                        shockwaves.splice(i, 1);
                        continue;
                    }
                    if (sw.age < 0) continue;
                    sw.radius += sw.speed * dt;
                    const lifeK = sw.age / sw.life;
                    sw.alpha = sw.alpha * (1 - lifeK);
                    sw.lineWidth = sw.lineWidth * (1 - lifeK * 0.82);
                }

                for (let i = dustParticles.length - 1; i >= 0; i--) {
                    const dp = dustParticles[i];
                    dp.age += dt;
                    if (dp.age > dp.life) {
                        dustParticles.splice(i, 1);
                        continue;
                    }
                    dp.vx *= dp.drag;
                    dp.vy = dp.vy * dp.drag - 12 * dt;
                    dp.x += dp.vx * dt;
                    dp.y += dp.vy * dt;
                    dp.radius += 10 * dt;
                    const lifeK = dp.age / dp.life;
                    dp.alpha = dp.alpha * (1 - lifeK * 0.8);
                }

                if (t < 4.5 && Math.random() < 0.75) createSmoke(3);
                if (t < 2.0 && Math.random() < 0.5) createMushroomSmoke(2);
                if (t < 4.0 && Math.random() < 0.55) createEmbers(2);
                if (fireballActive && t < 2.0 && Math.random() < 0.7) createFireballParticles(4);
                if (t < 3.0 && Math.random() < 0.4) createDust(2);
            }

            // ==================== 爆炸渲染 ====================
            function renderExplosion() {
                ctx.fillStyle = '#0a0a0c';
                ctx.fillRect(0, 0, W, H);

                let shakeX = 0, shakeY = 0;
                if (screenShakeIntensity > 0.01) {
                    const intensity = screenShakeIntensity * 22;
                    shakeX = (Math.random() - 0.5) * 2 * intensity;
                    shakeY = (Math.random() - 0.5) * 2 * intensity;
                }

                ctx.save();
                ctx.translate(shakeX, shakeY);

                // 背景渐变
                const bgGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 20);
                bgGrad.addColorStop(0, '#0d0d12');
                bgGrad.addColorStop(0.55, '#14141a');
                bgGrad.addColorStop(1, '#1a1512');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(-30, -30, W + 60, GROUND_Y + 30);

                // 地面
                const groundGrad = ctx.createLinearGradient(0, GROUND_Y - 5, 0, H);
                groundGrad.addColorStop(0, '#2a221c');
                groundGrad.addColorStop(0.15, '#1e1814');
                groundGrad.addColorStop(1, '#0f0c0a');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(-30, GROUND_Y - 3, W + 60, H - GROUND_Y + 30);

                // 地面纹理
                ctx.strokeStyle = 'rgba(60,50,40,0.25)';
                ctx.lineWidth = 0.5;
                for (let i = 0; i < 18; i++) {
                    const y = GROUND_Y + rand(0, H - GROUND_Y);
                    ctx.beginPath();
                    ctx.moveTo(0, y + Math.sin(i * 7.3) * 3);
                    ctx.lineTo(W, y + Math.cos(i * 5.1) * 3);
                    ctx.stroke();
                }

                // === 移除了弹坑/黑色圆圈渲染 ===

                // 灰尘
                for (const dp of dustParticles) {
                    const alpha = dp.alpha * (1 - dp.age / dp.life);
                    const grad = ctx.createRadialGradient(dp.x, dp.y, 0, dp.x, dp.y, dp.radius);
                    grad.addColorStop(0, rgbaStr(dp.color, alpha));
                    grad.addColorStop(1, rgbaStr(dp.color, 0));
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(dp.x, dp.y, dp.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 冲击波
                for (const sw of shockwaves) {
                    if (sw.age < 0) continue;
                    const alpha = sw.alpha * (1 - sw.age / sw.life);
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.strokeStyle = `rgba(255,220,180,${clamp(alpha,0,1)})`;
                    ctx.lineWidth = Math.max(sw.lineWidth, 0.5);
                    ctx.shadowColor = `rgba(255,160,80,${clamp(alpha,0,1)})`;
                    ctx.shadowBlur = 35 * alpha;
                    ctx.beginPath();
                    if (sw.isGround) {
                        ctx.ellipse(sw.x, sw.y, sw.radius, sw.radius * 0.22, 0, 0, Math.PI * 2);
                    } else {
                        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                    }
                    ctx.stroke();
                    
                    ctx.strokeStyle = `rgba(255,255,255,${clamp(alpha*0.55,0,1)})`;
                    ctx.lineWidth = Math.max(sw.lineWidth * 0.35, 0.3);
                    ctx.shadowBlur = 18 * alpha;
                    ctx.beginPath();
                    if (sw.isGround) {
                        ctx.ellipse(sw.x, sw.y, sw.radius * 0.92, sw.radius * 0.2, 0, 0, Math.PI * 2);
                    } else {
                        ctx.arc(sw.x, sw.y, sw.radius * 0.92, 0, Math.PI * 2);
                    }
                    ctx.stroke();
                    ctx.restore();
                }

                // 烟雾渲染（大幅增强可见度）
                ctx.save();
                ctx.globalCompositeOperation = 'source-over';
                for (const s of smokeParticles) {
                    const lifeK = s.age / s.life;
                    const alpha = s.currentAlpha !== undefined ? s.currentAlpha : s.alpha;
                    const r = s.radius * (1 + lifeK * 2.0);
                    
                    // 内部偏暖（残余热量）
                    const heatR = Math.floor(s.colorBase.r + s.heatAmount * 60);
                    const heatG = Math.floor(s.colorBase.g + s.heatAmount * 35);
                    const heatB = Math.floor(s.colorBase.b + s.heatAmount * 18);
                    
                    // 外部深色
                    const darkR = Math.floor(s.colorBase.r * (1 - lifeK * 0.35));
                    const darkG = Math.floor(s.colorBase.g * (1 - lifeK * 0.4));
                    const darkB = Math.floor(s.colorBase.b * (1 - lifeK * 0.45));
                    
                    const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
                    grad.addColorStop(0, rgbaStr({ r: heatR, g: heatG, b: heatB }, alpha));
                    grad.addColorStop(0.3, rgbaStr({ r: darkR, g: darkG, b: darkB }, alpha * 0.92));
                    grad.addColorStop(0.7, rgbaStr({ r: darkR, g: darkG, b: darkB }, alpha * 0.55));
                    grad.addColorStop(1, rgbaStr({ r: darkR + 15, g: darkG + 12, b: darkB + 10 }, 0));
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // 火球
                if (fireballActive && fireballRadius > 5 && explosionTime < 4.0) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';

                    const t = explosionTime;
                    const baseRadius = fireballRadius;

                    const layers = [
                        { r: baseRadius * 0.22, color: 'rgba(255,255,255,0.98)', offset: 0 },
                        { r: baseRadius * 0.45, color: 'rgba(255,245,200,0.9)', offset: 0.03 },
                        { r: baseRadius * 0.68, color: 'rgba(255,200,90,0.78)', offset: 0.06 },
                        { r: baseRadius * 0.88, color: 'rgba(255,120,30,0.58)', offset: 0.1 },
                        { r: baseRadius * 1.08, color: 'rgba(220,60,15,0.38)', offset: 0.15 },
                        { r: baseRadius * 1.3, color: 'rgba(140,30,8,0.22)', offset: 0.22 },
                        { r: baseRadius * 1.55, color: 'rgba(80,20,5,0.12)', offset: 0.3 },
                    ];

                    const timeFactor = clamp(t / 3.0, 0, 1);
                    const fadeAlpha = 1 - timeFactor * 0.7;

                    for (const layer of layers) {
                        const cx = EXPLOSION_X + Math.sin(t * 3.1 + layer.offset * 7) * baseRadius * 0.1;
                        const cy = EXPLOSION_Y + Math.cos(t * 2.7 + layer.offset * 5) * baseRadius * 0.08 - baseRadius * 0.05;
                        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, layer.r);
                        const col = layer.color.replace(/[\d.]+\)$/, (m) => {
                            const a = parseFloat(m) * fadeAlpha;
                            return clamp(a, 0, 1) + ')';
                        });
                        grad.addColorStop(0, col);
                        grad.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(cx, cy, layer.r, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    if (t < 2.2) {
                        const turbCount = Math.floor(40 * fadeAlpha);
                        for (let i = 0; i < turbCount; i++) {
                            const tx = EXPLOSION_X + (Math.random() - 0.5) * baseRadius * 0.7;
                            const ty = EXPLOSION_Y + (Math.random() - 0.5) * baseRadius * 0.65 - baseRadius * 0.05;
                            const tr = rand(5, baseRadius * 0.25);
                            const heatT = Math.random() * 0.4;
                            const hc = heatColor(heatT);
                            const turbGrad = ctx.createRadialGradient(tx, ty, 0, tx, ty, tr);
                            turbGrad.addColorStop(0, rgbaStr(hc, rand(0.35, 0.75) * fadeAlpha));
                            turbGrad.addColorStop(1, 'rgba(0,0,0,0)');
                            ctx.fillStyle = turbGrad;
                            ctx.beginPath();
                            ctx.arc(tx, ty, tr, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    if (t < 2.0) {
                        const flameHeight = baseRadius * (1.5 - t * 0.5);
                        for (let i = 0; i < 25; i++) {
                            const fx = EXPLOSION_X + (Math.random() - 0.5) * baseRadius * 0.4;
                            const fy = EXPLOSION_Y - baseRadius * 0.5 - Math.random() * flameHeight;
                            const fr = rand(6, baseRadius * 0.35);
                            const fhc = heatColor(rand(0.05, 0.35));
                            const fGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr);
                            fGrad.addColorStop(0, rgbaStr(fhc, rand(0.25, 0.55) * fadeAlpha));
                            fGrad.addColorStop(1, 'rgba(0,0,0,0)');
                            ctx.fillStyle = fGrad;
                            ctx.beginPath();
                            ctx.arc(fx, fy, fr, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    ctx.restore();
                }

                // 火球粒子
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                for (const f of fireParticles) {
                    const lifeK = f.age / f.life;
                    const alpha = f.alpha * (1 - lifeK * 0.9);
                    const hc = heatColor(f.colorHeat);
                    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
                    grad.addColorStop(0, rgbaStr(hc, alpha));
                    grad.addColorStop(0.5, rgbaStr(hc, alpha * 0.4));
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // === 碎片渲染（真实改进）===
                ctx.save();
                for (const d of debris) {
                    ctx.save();
                    ctx.translate(d.x, d.y);
                    ctx.rotate(d.rotation);
                    
                    // 碎片拖尾（先画，在碎片下方）—— 带烟雾感
                    if (!d.grounded && d.age < 2.5) {
                        const speed = Math.sqrt(d.vx * d.vx + d.vy * d.vy);
                        if (speed > 5) {
                            const trailAlpha = 0.45 * (1 - d.age / 2.5);
                            const trailR = d.size * (1.5 + d.heatLevel * 0.5);
                            const trailLen = Math.min(speed * d.trailFactor, d.size * 10);
                            const dirX = -d.vx / speed;
                            const dirY = -d.vy / speed;
                            
                            ctx.save();
                            ctx.globalCompositeOperation = 'lighter';
                            // 燃烧拖尾（橙红色）
                            if (d.heatLevel > 0.2) {
                                const trailGrad = ctx.createRadialGradient(
                                    dirX * trailLen * 0.3, dirY * trailLen * 0.3, 0,
                                    dirX * trailLen * 0.3, dirY * trailLen * 0.3, trailR
                                );
                                const trailColor = { 
                                    r: 255, 
                                    g: Math.floor(80 + d.heatLevel * 100), 
                                    b: Math.floor(20 + d.heatLevel * 30) 
                                };
                                trailGrad.addColorStop(0, rgbaStr(trailColor, trailAlpha * d.heatLevel));
                                trailGrad.addColorStop(0.5, rgbaStr(trailColor, trailAlpha * d.heatLevel * 0.4));
                                trailGrad.addColorStop(1, 'rgba(0,0,0,0)');
                                ctx.fillStyle = trailGrad;
                                ctx.beginPath();
                                ctx.arc(dirX * trailLen * 0.3, dirY * trailLen * 0.3, trailR, 0, Math.PI * 2);
                                ctx.fill();
                            }
                            ctx.restore();
                            
                            // 烟雾拖尾（深灰色）
                            ctx.save();
                            const smokeTrailR = d.size * 2.5;
                            const smokeGrad = ctx.createRadialGradient(
                                dirX * trailLen * 0.4, dirY * trailLen * 0.4, 0,
                                dirX * trailLen * 0.4, dirY * trailLen * 0.4, smokeTrailR
                            );
                            const smokeColor = { r: 40, g: 35, b: 30 };
                            smokeGrad.addColorStop(0, rgbaStr(smokeColor, trailAlpha * 0.5));
                            smokeGrad.addColorStop(0.5, rgbaStr(smokeColor, trailAlpha * 0.25));
                            smokeGrad.addColorStop(1, 'rgba(0,0,0,0)');
                            ctx.fillStyle = smokeGrad;
                            ctx.beginPath();
                            ctx.arc(dirX * trailLen * 0.4, dirY * trailLen * 0.4, smokeTrailR, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        }
                    }
                    
                    // 碎片主体 —— 深色不规则形状
                    const heatT = clamp(d.age / d.life, 0, 1);
                    const heat = d.heatLevel * (1 - heatT * 0.7);
                    
                    // 主体颜色（深灰到黑，带轻微热量发红）
                    const bodyR = Math.floor(d.baseColor.r + heat * 40);
                    const bodyG = Math.floor(d.baseColor.g + heat * 15);
                    const bodyB = Math.floor(d.baseColor.b + heat * 5);
                    
                    ctx.fillStyle = rgbaStr({ r: bodyR, g: bodyG, b: bodyB }, d.grounded ? 0.9 : 0.95);
                    ctx.beginPath();
                    const verts = d.verts;
                    for (let v = 0; v < verts.length; v++) {
                        if (v === 0) ctx.moveTo(verts[v].x, verts[v].y);
                        else ctx.lineTo(verts[v].x, verts[v].y);
                    }
                    ctx.closePath();
                    ctx.fill();
                    
                    // 碎片内部纹理（高光面）
                    ctx.fillStyle = `rgba(${Math.floor(bodyR * 1.5)},${Math.floor(bodyG * 1.5)},${Math.floor(bodyB * 1.5)},0.3)`;
                    ctx.beginPath();
                    // 取前1/3的顶点画小高光
                    const halfVerts = Math.max(2, Math.floor(verts.length / 3));
                    for (let v = 0; v < halfVerts; v++) {
                        const vx = verts[v].x * 0.5;
                        const vy = verts[v].y * 0.5;
                        if (v === 0) ctx.moveTo(vx, vy);
                        else ctx.lineTo(vx, vy);
                    }
                    ctx.closePath();
                    ctx.fill();
                    
                    // 燃烧边缘发光
                    if (!d.grounded && heat > 0.25) {
                        ctx.save();
                        ctx.globalCompositeOperation = 'lighter';
                        ctx.strokeStyle = `rgba(255, ${Math.floor(70 + heat * 120)}, ${Math.floor(15 + heat * 50)}, ${heat * 0.7})`;
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        for (let v = 0; v < verts.length; v++) {
                            if (v === 0) ctx.moveTo(verts[v].x, verts[v].y);
                            else ctx.lineTo(verts[v].x, verts[v].y);
                        }
                        ctx.closePath();
                        ctx.stroke();
                        ctx.restore();
                    }
                    
                    // 描边（深色）
                    ctx.strokeStyle = `rgba(${Math.floor(bodyR * 0.4)},${Math.floor(bodyG * 0.4)},${Math.floor(bodyB * 0.4)},0.8)`;
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    for (let v = 0; v < verts.length; v++) {
                        if (v === 0) ctx.moveTo(verts[v].x, verts[v].y);
                        else ctx.lineTo(verts[v].x, verts[v].y);
                    }
                    ctx.closePath();
                    ctx.stroke();
                    
                    ctx.restore();
                }
                ctx.restore();

                // 余烬
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                for (const e of embers) {
                    const lifeK = e.age / e.life;
                    const flicker = 0.6 + 0.4 * Math.sin(e.age * e.flickerSpeed + e.flickerPhase);
                    const alpha = flicker * (1 - lifeK * 0.8);
                    const hc = heatColor(0.1 + lifeK * 0.6);
                    const r = e.size * (1 - lifeK * 0.4);
                    const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
                    grad.addColorStop(0, rgbaStr(hc, alpha));
                    grad.addColorStop(0.6, rgbaStr(hc, alpha * 0.3));
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // 地面火焰
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                for (const g of groundFires) {
                    const lifeK = g.age / g.life;
                    const flicker = 0.65 + 0.35 * Math.sin(g.age * g.flickerSpeed + g.flickerPhase);
                    const alpha = g.baseAlpha * flicker * (1 - lifeK * 0.85);
                    const r = g.radius * (1 + Math.sin(g.age * g.flickerSpeed * 0.7 + g.flickerPhase) * 0.2);
                    const hc = heatColor(0.25 + lifeK * 0.55);
                    const grad = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, r);
                    grad.addColorStop(0, rgbaStr(hc, alpha));
                    grad.addColorStop(0.5, rgbaStr({ r: 200, g: 60, b: 10 }, alpha * 0.5));
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(g.x, g.y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // 初始闪光
                if (initialFlashIntensity > 0.01) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    const flashGrad = ctx.createRadialGradient(
                        EXPLOSION_X, EXPLOSION_Y, 0,
                        EXPLOSION_X, EXPLOSION_Y, MAX_FIREBALL_RADIUS * 3.5
                    );
                    flashGrad.addColorStop(0, `rgba(255,255,255,${clamp(initialFlashIntensity,0,1)})`);
                    flashGrad.addColorStop(0.25, `rgba(255,245,210,${clamp(initialFlashIntensity*0.85,0,1)})`);
                    flashGrad.addColorStop(0.55, `rgba(255,180,80,${clamp(initialFlashIntensity*0.45,0,1)})`);
                    flashGrad.addColorStop(0.85, `rgba(255,100,30,${clamp(initialFlashIntensity*0.15,0,1)})`);
                    flashGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = flashGrad;
                    ctx.fillRect(-30, -30, W + 60, H + 60);
                    ctx.restore();
                }

                // 暖光覆盖
                if (explosionTime < 4.0 && explosionTime > 0.05) {
                    const warmAlpha = clamp(1 - explosionTime / 4.0, 0, 1) * 0.45;
                    ctx.save();
                    ctx.globalCompositeOperation = 'screen';
                    const warmGrad = ctx.createRadialGradient(
                        EXPLOSION_X, EXPLOSION_Y, 0,
                        EXPLOSION_X, EXPLOSION_Y, MAX_FIREBALL_RADIUS * 2.8
                    );
                    warmGrad.addColorStop(0, `rgba(255,160,50,${warmAlpha})`);
                    warmGrad.addColorStop(0.5, `rgba(255,80,20,${warmAlpha*0.5})`);
                    warmGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = warmGrad;
                    ctx.fillRect(-30, -30, W + 60, H + 60);
                    ctx.restore();
                }

                ctx.restore();
            }

            // ==================== 主循环 ====================
            let lastTime = performance.now();

            function gameLoop(currentTime) {
                const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
                lastTime = currentTime;

                if (phase === 'idle') {
                    idleTime += dt;
                    if (idleTime >= idleDuration) {
                        triggerExplosion();
                        phase = 'explosion';
                    }
                } else if (phase === 'explosion') {
                    updateExplosion(dt);

                    if (explosionTime > 0.7 && !textShown) {
                        textShown = true;
                        fakeTextEl.classList.add('show');
                    }
                }

                if (phase === 'idle') {
                    renderBombScene();
                } else {
                    renderExplosion();
                }

                if (phase === 'explosion' && explosionTime < 4.0) {
                    warmGlow.style.opacity = clamp(1 - explosionTime / 4.0, 0, 1);
                } else {
                    warmGlow.style.opacity = 0;
                }

                requestAnimationFrame(gameLoop);
            }

            function startSequence() {
                phase = 'idle';
                idleTime = 0;
                textShown = false;
                initAudio();

                const tryResumeAudio = () => {
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume().catch(() => {});
                    }
                };
                document.addEventListener('click', tryResumeAudio, { once: true });
                document.addEventListener('touchstart', tryResumeAudio, { once: true });
                document.addEventListener('keydown', tryResumeAudio, { once: true });

                requestAnimationFrame((t) => {
                    lastTime = t;
                    requestAnimationFrame(gameLoop);
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(startSequence, 60);
                });
            } else {
                setTimeout(startSequence, 60);
            }

            console.log('💥 炸弹已就绪！');
        })();
    </script>
</body>
</html>
