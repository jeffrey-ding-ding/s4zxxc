<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上海市第四中学校草评选</title>
    <style>
        :root {
            --canvas: #faf9f5;
            --ink: #141413;
            --ink-soft: #3d3d3a;
            --text-muted: #5e5d59;
            --surface-secondary: #f0eee6;
            --hairline: #d1cfc5;
            --accent-clay: #d97757;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", Times, Georgia, serif;
            background-color: var(--canvas);
            color: var(--ink);
            line-height: 1.7;
            margin: 0;
            padding: 0;
        }

        .disclaimer {
            background-color: var(--surface-secondary);
            border-bottom: 2px solid var(--ink);
            padding: 1.5rem 2rem;
            text-align: center;
        }

        .disclaimer p {
            font-size: 1.1rem;
            color: var(--ink);
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-weight: 500;
        }

        .container {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            min-height: calc(100vh - 100px);
        }
        .left-panel {
            flex: 1;
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid var(--hairline);
        }

        .right-panel {
            flex: 1;
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: var(--surface-secondary);
        }

        h1 {
            font-family: "Times New Roman", Times, Georgia, serif;
            font-size: 3rem;
            color: var(--accent-clay);
            margin-bottom: 1rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.3rem;
            color: var(--ink-soft);
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin-bottom: 3rem;
        }
        .school-badge {
            margin-top: 2rem;
            text-align: center;
        }

        .school-badge img {
            width: 180px;
            height: auto;
            border-radius: var(--radius);
            border: 1px solid var(--hairline);
        }

        .school-badge p {
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: 1rem;
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        .instructions {
            margin-top: 3rem;
            padding: 1.5rem;
            border-left: 3px solid var(--accent-clay);
            background-color: var(--surface-secondary);
            border-radius: 0 var(--radius) var(--radius) 0;
        }

        .instructions h3 {
            color: var(--ink);
            font-family: "Times New Roman", Times, Georgia, serif;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .instructions p {
            color: var(--ink-soft);
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        .nomination-form {
            background-color: var(--canvas);
            padding: 2.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--hairline);
            max-width: 450px;
            margin: 0 auto;
            width: 100%;
        }

        .form-group {
            margin-bottom: 1.8rem;
        }

        label {
            display: block;
            margin-bottom: 0.7rem;
            font-weight: 600;
            color: var(--ink);
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 1rem;
        }

        input, select {
            width: 100%;
            padding: 0.9rem 1.1rem;
            border: 1px solid var(--hairline);
            border-radius: var(--radius);
            font-size: 1rem;
            background-color: var(--surface-secondary);
            color: var(--ink);
            font-family: "Helvetica Neue", Arial, sans-serif;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--ink);
            background-color: var(--canvas);
        }

        .submit-btn {
            width: 100%;
            padding: 1.1rem;
            background-color: var(--ink);
            color: var(--canvas);
            border: none;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #000000;
        }

        .success-message {
            display: none;
            background-color: var(--surface-secondary);
            border: 1px solid var(--ink);
            color: var(--ink);
            padding: 1.5rem;
            border-radius: var(--radius);
            text-align: center;
            margin-top: 1.5rem;
            font-weight: 500;
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            
            .left-panel {
                border-right: none;
                border-bottom: 1px solid var(--hairline);
                padding: 3rem 2rem;
            }
            
            .right-panel {
                padding: 3rem 2rem;
            }
            
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="disclaimer">
        <p>本网站仅供娱乐，请勿过度带入实际，随时可能关闭。</p>
    </div>

    <div class="container">
        <div class="left-panel">
            <h1>上海市第四中学校草评选</h1>
            <p class="subtitle">为心中的校园之星投上一票</p>
            
            <div class="school-badge">
                <img src="https://ts2.tc.mm.bing.net/th/id/OIP-C.iVhx_mVtR9b5HKDaa_qWlgHaHJ?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="上海市第四中学校徽">
                <p>上海市第四中学校徽</p>
            </div>
            
            <div class="instructions">
                <h3>参与方式</h3>
                <p>填写以下信息推荐你心中的校草候选人。我们仅收集必要信息，不涉及个人隐私。</p>
            </div>
        </div>
        
        <div class="right-panel">
            <form class="nomination-form" id="nominationForm">
                <div class="form-group">
                    <label for="grade">年级</label>
                    <select id="grade" name="grade" required>
                        <option value="">请选择年级</option>
                        <option value="初一">初一</option>
                        <option value="初二">初二</option>
                        <option value="初三">初三</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="class">班级 (1-10)</label>
                    <input type="number" id="class" name="class" min="1" max="10" required 
                           placeholder="请输入班级数字 (1-10)">
                </div>

                <div class="form-group">
                    <label for="studentId">学号</label>
                    <input type="text" id="studentId" name="studentId" required 
                           placeholder="请输入学号 (不含姓名)">
                </div>

                <button type="submit" class="submit-btn">提交推荐</button>
                
                <div class="success-message" id="successMessage">
                    <p>感谢您的推荐！您的提名已收到。</p>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('nominationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            

            const grade = document.getElementById('grade').value;
            const classNum = document.getElementById('class').value;
            const studentId = document.getElementById('studentId').value;
            

            const classNumber = parseInt(classNum);
            if (classNumber < 1 || classNumber > 10) {
                alert('班级必须在1到10之间');
                return;
            }
            

            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';
            

            this.reset();
            

            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
            
            console.log('提交的推荐信息:', {
                grade: grade,
                class: classNum,
                studentId: studentId
            });
        });
        
        document.getElementById('class').addEventListener('input', function() {
            const value = parseInt(this.value);
            if (value < 1) this.value = 1;
            if (value > 10) this.value = 10;
        });

        document.getElementById('studentId').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
